<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Louise | Counselling &amp; Psychotherapy</title>
  <meta name="description" content="Counselling and psychotherapy in Mount Alexander Shire, Victoria. Website coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #e9ede6;
      --text: #2b3a33;
      --muted: #5c6b62;
      --accent: #4f6f5f;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Lora", Georgia, "Times New Roman", serif;
      line-height: 1.7;
      display: flex;
      align-items: center;
      padding: 2rem 1.5rem;
    }
    main { max-width: 34rem; margin: 0 auto; }
    h1 { font-weight: 500; font-size: clamp(2rem, 6vw, 2.75rem); line-height: 1.15; margin-bottom: 0.4rem; }
    .role { font-style: italic; color: var(--muted); font-size: 1.15rem; margin-bottom: 2rem; }
    p { margin-bottom: 1.25rem; }
    a { color: var(--accent); text-underline-offset: 3px; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .small { font-size: 0.9rem; color: var(--muted); margin-top: 2.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>Louise Terry</h1>
    <p class="role">Counselling &amp; Psychotherapy</p>
    <p>Based in Mount Alexander Shire, Victoria.</p>
    <p>My full website is on its way. In the meantime, you're welcome to get in touch by email.</p>
    <p><a href="mailto:hello@louiseterry.com">hello@louiseterry.com</a></p>
    <p class="small">If you need urgent support, call Lifeline on 13 11 14 or 000 in an emergency.</p>
  </main>
</body>
</html>
