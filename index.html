<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Louise Terry | Counselling &amp; Psychotherapy</title>
  <meta name="description" content="Counselling and psychotherapy in Mount Alexander Shire, Victoria. Website coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #efe9d3;
      --card: rgba(246, 242, 228, 0.9);
      --text: #2b3a33;
      --muted: #5c6b62;
      --accent: #4f6f5f;
      --accent-dark: #3f5a4c;
    }
    * { box-sizing: border-box; margin: 0; }
    html { height: 100%; }
    body {
      min-height: 100%;
      background: var(--bg) url("images/growing.jpg") center / cover no-repeat;
      color: var(--text);
      font-family: "Lora", Georgia, "Times New Roman", serif;
      line-height: 1.7;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.25rem, 4vw, 3rem) 1.25rem;
    }
    main {
      width: 100%;
      max-width: 50rem;
      background: var(--card);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      border-radius: 1.25rem;
      box-shadow: 0 16px 50px rgba(43, 58, 51, 0.22);
      padding: clamp(1.5rem, 4vw, 2.75rem);
    }
    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 1.75rem;
      align-items: center;
    }
    .portrait {
      display: block;
      width: min(100%, 15rem);
      height: auto;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      object-position: 50% 20%;
      border-radius: 1rem;
      box-shadow: 0 8px 24px rgba(43, 58, 51, 0.18);
    }
    h1 { font-weight: 500; font-size: clamp(2.2rem, 6vw, 3rem); line-height: 1.1; margin-bottom: 0.35rem; }
    .role { font-style: italic; color: var(--muted); font-size: 1.2rem; margin-bottom: 1.5rem; }
    p { margin-bottom: 1.1rem; }
    a { color: var(--accent); text-underline-offset: 3px; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .button {
      display: inline-block;
      background: var(--accent);
      color: #f6f2e4;
      text-decoration: none;
      padding: 0.7rem 1.3rem;
      border-radius: 999px;
      margin-top: 0.25rem;
    }
    .button:hover { background: var(--accent-dark); }
    footer {
      border-top: 1px solid rgba(43, 58, 51, 0.15);
      margin-top: 2rem;
      padding-top: 1.25rem;
    }
    .small { font-size: 0.9rem; color: var(--muted); margin: 0; }

    @media (min-width: 40rem) {
      .intro { grid-template-columns: auto minmax(0, 1fr); gap: 2.5rem; }
      .portrait { width: 15rem; }
    }
  </style>
</head>
<body>
  <main>
    <section class="intro">
      <img class="portrait" src="images/headshot.jpg" width="737" height="1000" alt="Louise Terry, smiling, wearing a mustard and purple shirt">
      <div>
        <h1>Louise Terry</h1>
        <p class="role">Counselling &amp; Psychotherapy</p>
        <p>Based in Mount Alexander Shire, Victoria.</p>
        <p>My full website is on its way. In the meantime, you're welcome to get in touch by email.</p>
        <a class="button" href="mailto:hello@louiseterry.com">hello@louiseterry.com</a>
      </div>
    </section>
    <footer>
      <p class="small">If you need urgent support, call Lifeline on 13 11 14 or 000 in an emergency.</p>
    </footer>
  </main>
</body>
</html>
